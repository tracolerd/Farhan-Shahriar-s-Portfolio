<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
 <title id="title">Farhan Shahriar · Portfolio — project banner</title><desc id="desc">A static HTML, CSS and JavaScript portfolio presenting Farhan Shahriar’s profile, education, experience, skills and contact sections.</desc>
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100F16"/><stop offset=".57" stop-color="#292012"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E7B977"/><stop offset="1" stop-color="#8C6844"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#E7B977" stop-opacity=".25"/><stop offset="1" stop-color="#E7B977" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C9D5E7" stroke-opacity=".07"/></pattern>
  <filter id="glowFx" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
   @keyframes orbit {to{stroke-dashoffset:-160}} @keyframes pulse {0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.1)}} @keyframes sweep {0%{transform:translateX(-300px)}100%{transform:translateX(1400px)}}
   .orbit{animation:orbit 28s linear infinite;transform-origin:1000px 186px}.pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse2{animation:pulse 4s ease-in-out infinite .6s;transform-box:fill-box;transform-origin:center}
   @media(prefers-reduced-motion:reduce){.orbit,.pulse,.pulse2{animation:none}}
  </style>
 </defs>
