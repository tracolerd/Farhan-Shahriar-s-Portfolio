  <rect x="72" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#E7B977" stroke-opacity=".35"/><circle cx="89" cy="305" r="3" fill="#E7B977" filter="url(#glowFx)"/><text x="101" y="310" font-size="11" font-weight="700" letter-spacing="1.1" fill="#E2E8F0">HTML · CSS · JS</text><rect x="257" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#E7B977" stroke-opacity=".35"/><circle cx="274" cy="305" r="3" fill="#E7B977" filter="url(#glowFx)"/><text x="286" y="310" font-size="11" font-weight="700" letter-spacing="1.1" fill="#E2E8F0">GSAP MOTION</text><rect x="442" y="286" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity=".035" stroke="#E7B977" stroke-opacity=".35"/><circle cx="459" cy="305" r="3" fill="#E7B977" filter="url(#glowFx)"/><text x="471" y="310" font-size="11" font-weight="700" letter-spacing="1.1" fill="#E2E8F0">STATIC WEBSITE</text>
  <text x="72" y="382" fill="#94A3B8" font-size="11" letter-spacing="2.8">DESIGNED WITH INTENT  ·  BUILT TO BE EXPLORED</text>
 </g>
